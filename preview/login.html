<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism · login preview</title>
<link rel="stylesheet" href="../htdocs/luci-static/prism/cascade.css">
<link rel="stylesheet" href="../htdocs/luci-static/prism/login.css">
<link rel="icon" href="../htdocs/luci-static/prism/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
<div class="prism-bg" aria-hidden="true">
	<span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
	<span class="grid"></span><span class="noise"></span>
</div>
<main class="login-wrap">
	<form class="login-card" onsubmit="event.preventDefault(); this.classList.add('busy'); setTimeout(() => location.href = 'index.html', 1400);">
		<div class="login-mark" aria-hidden="true">
			<svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M24 4 44 40H4Z" fill="none" stroke="url(#lg)" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 4 30 40M24 4 14 40" stroke="url(#lg)" stroke-width="1.3" opacity=".6"/></svg>
		</div>
		<h1>OpenWrt</h1>
		<p class="login-sub">GL.iNet GL-MT6000</p>
		<label class="field"><input type="text" value="root" placeholder=" " autocomplete="username"><span>사용자 이름</span></label>
		<label class="field"><input type="password" placeholder=" " autocomplete="current-password" autofocus><span>비밀번호</span></label>
		<button type="submit" class="cbi-button cbi-button-apply login-submit">로그인</button>
		<p class="login-foot">OpenWrt 24.10.2 · LuCI openwrt-24.10</p>
	</form>
</main>
</body>
</html>
